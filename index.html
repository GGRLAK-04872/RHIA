<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#8f2948">
<title>RHIA Alpha v0.5</title>

<style>
:root{
  --bg:#0d090c;
  --panel:#191116;
  --panel-soft:rgba(25,17,22,.94);
  --accent:#8f2948;
  --accent-light:#c14d73;
  --text:#f5edf1;
  --muted:#b9a8b1;
  --border:rgba(193,77,115,.25);
  --success:#78c69a;
  --danger:#e7a6b2;
  --warning:#e8c27a;
}
*{box-sizing:border-box}
html{min-height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  background:radial-gradient(circle at 20% 0%,#2a1420 0%,var(--bg) 45%);
}
button,input{font:inherit}
button{touch-action:manipulation}
.app{
  min-height:100vh;
  display:grid;
  grid-template-columns:minmax(0,1fr) 380px;
}
main{
  min-width:0;
  padding:24px;
  display:flex;
  flex-direction:column;
  gap:18px;
}
header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:15px;
}
h1,h2,h3{margin-top:0}
h1{margin-bottom:0;letter-spacing:3px}
.subtitle{color:var(--muted);margin-top:5px}
.version{
  flex-shrink:0;
  padding:7px 12px;
  border:1px solid var(--border);
  border-radius:20px;
  color:#e7c2ce;
  background:rgba(143,41,72,.12);
}
.chat{
  flex:1;
  display:flex;
  flex-direction:column;
  min-height:600px;
  background:var(--panel-soft);
  border:1px solid var(--border);
  border-radius:22px;
  overflow:hidden;
  box-shadow:0 18px 45px rgba(0,0,0,.24);
}
.status{
  padding:14px 18px;
  border-bottom:1px solid var(--border);
  color:#d8c8cf;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:12px;
}
.status-dot{color:var(--success)}
.focus-label{
  display:none;
  color:var(--warning);
  font-size:13px;
}
.focus-label.active{display:inline}
.messages{
  flex:1;
  overflow:auto;
  padding:20px;
  display:flex;
  flex-direction:column;
  gap:12px;
  scroll-behavior:smooth;
}
.message{
  max-width:82%;
  padding:13px 15px;
  border-radius:15px;
  line-height:1.45;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
}
.message.rhia{
  align-self:flex-start;
  background:rgba(143,41,72,.22);
  border:1px solid rgba(193,77,115,.12);
  border-bottom-left-radius:4px;
}
.message.user{
  align-self:flex-end;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(255,255,255,.06);
  border-bottom-right-radius:4px;
}
.message-time{
  display:block;
  margin-top:6px;
  color:var(--muted);
  font-size:11px;
  opacity:.8;
}
.input{
  display:grid;
  grid-template-columns:1fr auto auto;
  gap:10px;
  padding:15px;
  border-top:1px solid var(--border);
}
input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid rgba(255,255,255,.12);
  background:rgba(255,255,255,.06);
  color:white;
  font-size:16px;
  outline:none;
}
input:focus{
  border-color:rgba(193,77,115,.75);
  box-shadow:0 0 0 3px rgba(143,41,72,.15);
}
input::placeholder{color:#a8959f}
button{
  padding:12px 18px;
  border:0;
  border-radius:12px;
  cursor:pointer;
  color:white;
  font-weight:bold;
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
}
button:hover{filter:brightness(1.08)}
button:active{transform:translateY(1px)}
button:disabled{opacity:.5;cursor:not-allowed}
.voice-button{
  min-width:50px;
  padding:12px;
  background:rgba(255,255,255,.09);
  border:1px solid var(--border);
}
.voice-button.listening{
  background:linear-gradient(135deg,var(--accent),var(--accent-light));
  animation:pulse 1.1s infinite;
}
@keyframes pulse{
  0%,100%{box-shadow:0 0 0 0 rgba(193,77,115,.35)}
  50%{box-shadow:0 0 0 8px rgba(193,77,115,0)}
}
aside{
  padding:24px;
  background:
    radial-gradient(circle at 50% 15%,rgba(193,77,115,.32),transparent 35%),
    linear-gradient(180deg,#24121b,#10090e);
  border-left:1px solid var(--border);
}
.storage-title{margin-bottom:18px}
.card{
  margin-bottom:18px;
  padding:16px;
  border-radius:17px;
  background:rgba(12,8,11,.75);
  border:1px solid var(--border);
}
.cardhead{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}
.cardhead h3{margin-bottom:0}
.count{
  min-width:28px;
  padding:6px;
  text-align:center;
  border-radius:20px;
  background:rgba(143,41,72,.3);
}
.item{
  display:grid;
  grid-template-columns:28px minmax(0,1fr) 30px;
  gap:8px;
  align-items:start;
  margin-top:9px;
  padding:10px;
  border-radius:10px;
  background:rgba(255,255,255,.05);
}
.number{color:#e8b7c7}
.item-text{overflow-wrap:anywhere;line-height:1.4}
.item-text.done{text-decoration:line-through;color:var(--muted)}
.item-meta{
  display:block;
  margin-top:4px;
  color:var(--muted);
  font-size:11px;
}
.action-small{
  width:28px;
  height:28px;
  padding:2px;
  background:transparent;
  border:1px solid rgba(255,255,255,.08);
  color:var(--muted);
}
.action-small.done-button{color:var(--success)}
.action-small.delete{color:var(--danger);font-size:18px;border:0}
.empty{margin-top:10px;color:var(--muted)}
.info{
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  color:var(--muted);
  background:rgba(255,255,255,.035);
  line-height:1.45;
  font-size:14px;
}
@media(max-width:850px){
  .app{grid-template-columns:1fr}
  aside{border-left:0;border-top:1px solid var(--border)}
  main{padding:14px}
  .chat{min-height:620px}
}
@media(max-width:500px){
  header{align-items:flex-start}
  .input{grid-template-columns:1fr auto}
  .input input{grid-column:1/-1}
  .message{max-width:92%}
  aside{padding:18px 14px}
}
</style>
</head>

<body>
<div class="app">
<main>
  <header>
    <div>
      <h1>RHIA</h1>
      <div class="subtitle">RH Intelligent Assistant</div>
    </div>
    <div class="version">Alpha v0.5</div>
  </header>

  <section class="chat">
    <div class="status">
      <span><span class="status-dot">●</span> Bereit, Mike</span>
      <span class="focus-label" id="focusLabel">Fokusmodus aktiv</span>
    </div>

    <div class="messages" id="messages" aria-live="polite" aria-label="Chatverlauf"></div>

    <form class="input" id="form">
      <input
        id="command"
        type="text"
        autocomplete="off"
        placeholder="Schreibe oder sprich mit RHIA …"
        aria-label="Nachricht an RHIA"
      >
      <button class="voice-button" id="voiceButton" type="button" title="Spracheingabe">🎤</button>
      <button type="submit">Senden</button>
    </form>
  </section>
</main>

<aside>
  <h2 class="storage-title">Lokaler Speicher</h2>

  <section class="card">
    <div class="cardhead">
      <h3>Aufgaben</h3>
      <span class="count" id="taskCount">0</span>
    </div>
    <div id="tasks"></div>
  </section>

  <section class="card">
    <div class="cardhead">
      <h3>Notizen</h3>
      <span class="count" id="noteCount">0</span>
    </div>
    <div id="notes"></div>
  </section>

  <div class="info">
    Chatverlauf, Aufgaben und Notizen werden lokal in diesem Browser gespeichert.
  </div>
  <div class="info">
    Bedienung zentral über den Chat. Die Schaltflächen rechts sind nur eine zusätzliche sichtbare Kontrolle.
  </div>
</aside>
</div>

<script>
"use strict";

const VERSION = "0.5";

/*
  Die alten Schlüssel bleiben absichtlich erhalten.
  Dadurch werden Aufgaben, Notizen und der Chat aus v0.3/v0.4 übernommen.
*/
const KEYS = {
  tasks: "rhia_tasks_v03",
  notes: "rhia_notes_v03",
  chat: "rhia_chat_v04",
  settings: "rhia_settings_v05"
};

const state = {
  tasks: normalizeEntries(load(KEYS.tasks), "task"),
  notes: normalizeEntries(load(KEYS.notes), "note"),
  chat: load(KEYS.chat),
  settings: Object.assign({focusMode:false}, loadObject(KEYS.settings))
};

const messages = document.getElementById("messages");
const command = document.getElementById("command");
const form = document.getElementById("form");
const tasksElement = document.getElementById("tasks");
const notesElement = document.getElementById("notes");
const taskCount = document.getElementById("taskCount");
const noteCount = document.getElementById("noteCount");
const voiceButton = document.getElementById("voiceButton");
const focusLabel = document.getElementById("focusLabel");

function load(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return [];
    const parsed = JSON.parse(raw);
    return Array.isArray(parsed) ? parsed : [];
  }catch(error){
    console.error("RHIA konnte lokale Daten nicht laden:", error);
    return [];
  }
}

function loadObject(key){
  try{
    const raw = localStorage.getItem(key);
    if(!raw) return {};
    const parsed = JSON.parse(raw);
    return parsed && typeof parsed === "object" && !Array.isArray(parsed) ? parsed : {};
  }catch(error){
    console.error("RHIA konnte Einstellungen nicht laden:", error);
    return {};
  }
}

function normalizeEntries(entries, type){
  return entries.map(entry => {
    if(typeof entry === "string"){
      return {
        text:entry,
        done:false,
        createdAt:new Date().toISOString(),
        type
      };
    }
    return {
      text:String(entry?.text ?? "").trim(),
      done:Boolean(entry?.done),
      createdAt:entry?.createdAt || new Date().toISOString(),
      type
    };
  }).filter(entry => entry.text);
}

function save(){
  try{
    localStorage.setItem(KEYS.tasks, JSON.stringify(state.tasks));
    localStorage.setItem(KEYS.notes, JSON.stringify(state.notes));
    localStorage.setItem(KEYS.chat, JSON.stringify(state.chat));
    localStorage.setItem(KEYS.settings, JSON.stringify(state.settings));
  }catch(error){
    console.error("RHIA konnte lokale Daten nicht speichern:", error);
  }
}

function formatTime(dateString){
  const date = new Date(dateString);
  if(Number.isNaN(date.getTime())) return "";
  return date.toLocaleString("de-DE", {
    day:"2-digit",
    month:"2-digit",
    hour:"2-digit",
    minute:"2-digit"
  });
}

function addMessage(text, type="rhia", store=true, createdAt=null){
  const cleanText = String(text ?? "").trim();
  if(!cleanText) return;

  const timestamp = createdAt || new Date().toISOString();
  const element = document.createElement("div");
  element.className = "message " + type;

  const content = document.createElement("span");
  content.textContent = cleanText;

  const time = document.createElement("small");
  time.className = "message-time";
  time.textContent = formatTime(timestamp);

  element.append(content, time);
  messages.appendChild(element);
  messages.scrollTop = messages.scrollHeight;

  if(store){
    state.chat.push({text:cleanText,type,createdAt:timestamp});
    save();
  }
}

function renderChat(){
  messages.innerHTML = "";
  state.chat.forEach(entry => {
    if(!entry || typeof entry.text !== "string") return;
    addMessage(
      entry.text,
      entry.type === "user" ? "user" : "rhia",
      false,
      entry.createdAt
    );
  });
}

function renderLists(){
  drawList("tasks", tasksElement);
  drawList("notes", notesElement);
  taskCount.textContent = state.tasks.length;
  noteCount.textContent = state.notes.length;
  focusLabel.classList.toggle("active", state.settings.focusMode);
}

function render(){
  renderChat();
  renderLists();
}

function drawList(type, target){
  const data = state[type];
  target.innerHTML = "";

  if(!data.length){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = type === "tasks"
      ? "Noch keine Aufgaben gespeichert."
      : "Noch keine Notizen gespeichert.";
    target.appendChild(empty);
    return;
  }

  data.forEach((entry,index) => {
    const row = document.createElement("div");
    row.className = "item";

    const firstButton = document.createElement("button");
    firstButton.type = "button";
    firstButton.className = "action-small" + (type === "tasks" ? " done-button" : "");
    firstButton.textContent = type === "tasks" ? (entry.done ? "↶" : "✓") : (index + 1);
    firstButton.title = type === "tasks"
      ? (entry.done ? "Aufgabe wieder öffnen" : "Aufgabe erledigen")
      : "Notiz Nummer " + (index + 1);

    if(type === "tasks"){
      firstButton.addEventListener("click", () => toggleTask(index));
    }else{
      firstButton.disabled = true;
    }

    const content = document.createElement("div");
    content.className = "item-text" + (entry.done ? " done" : "");
    content.textContent = entry.text;

    const meta = document.createElement("small");
    meta.className = "item-meta";
    meta.textContent = type === "tasks"
      ? (entry.done ? "Erledigt" : "Offen") + " · " + formatTime(entry.createdAt)
      : formatTime(entry.createdAt);
    content.appendChild(meta);

    const removeButton = document.createElement("button");
    removeButton.className = "action-small delete";
    removeButton.type = "button";
    removeButton.textContent = "×";
    removeButton.title = "Eintrag löschen";
    removeButton.addEventListener("click", () => removeByIndex(type,index));

    row.append(firstButton,content,removeButton);
    target.appendChild(row);
  });
}

function afterColon(text){
  const position = text.indexOf(":");
  return position < 0 ? "" : text.slice(position + 1).trim();
}

function stripWakeWord(text){
  return text.replace(/^\s*(hey\s+)?rhia[\s,.:;-]*/i,"").trim();
}

function startsWithAny(text, expressions){
  return expressions.some(expression => text.startsWith(expression));
}

function equalsAny(text, expressions){
  return expressions.includes(text);
}

function includesAny(text, expressions){
  return expressions.some(expression => text.includes(expression));
}

function createEntry(type,value){
  const clean = String(value ?? "").trim();
  if(!clean){
    addMessage(type === "tasks"
      ? "Welche Aufgabe soll ich speichern?"
      : "Welche Notiz soll ich speichern?");
    return;
  }

  const entry = {
    text:clean,
    done:false,
    createdAt:new Date().toISOString(),
    type:type === "tasks" ? "task" : "note"
  };

  state[type].push(entry);
  save();
  renderLists();

  addMessage(type === "tasks"
    ? "Erledigt, Sir. Die Aufgabe „" + clean + "“ wurde gespeichert."
    : "Gespeichert. Die Notiz „" + clean + "“ bleibt lokal erhalten.");
}

function showList(type){
  const data = state[type];
  const title = type === "tasks" ? "Aufgaben" : "Notizen";

  if(!data.length){
    addMessage("Du hast aktuell keine " + title.toLowerCase() + " gespeichert.");
    return;
  }

  const lines = data.map((entry,index) => {
    const status = type === "tasks" ? (entry.done ? " ✓" : " – offen") : "";
    return (index + 1) + ". " + entry.text + status;
  });

  addMessage(title + ":\n" + lines.join("\n"));
}

function removeByIndex(type,index){
  const data = state[type];
  if(index < 0 || index >= data.length){
    addMessage("Diesen Eintrag gibt es nicht.");
    return;
  }

  const removed = data.splice(index,1)[0];
  save();
  renderLists();

  addMessage(type === "tasks"
    ? "Die Aufgabe „" + removed.text + "“ wurde gelöscht."
    : "Die Notiz „" + removed.text + "“ wurde gelöscht.");
}

function removeNumber(type,text){
  const number = Number.parseInt(afterColon(text),10);
  if(!number || number < 1 || number > state[type].length){
    addMessage("Diese Nummer gibt es nicht. Sage zum Beispiel: „Aufgabe löschen: 1“.");
    return;
  }
  removeByIndex(type,number - 1);
}

function toggleTask(index){
  const task = state.tasks[index];
  if(!task){
    addMessage("Diese Aufgabe gibt es nicht.");
    return;
  }

  task.done = !task.done;
  save();
  renderLists();

  addMessage(task.done
    ? "Erledigt. „" + task.text + "“ ist abgeschlossen."
    : "„" + task.text + "“ ist wieder offen.");
}

function toggleTaskByNumber(text){
  const number = Number.parseInt(afterColon(text),10);
  if(!number || number < 1 || number > state.tasks.length){
    addMessage("Diese Aufgabennummer gibt es nicht.");
    return;
  }
  toggleTask(number - 1);
}

function clearChat(){
  state.chat = [];
  save();
  renderChat();
  addMessage("Der lokale Chatverlauf wurde gelöscht.","rhia",false);
}

function helpAnswer(){
  return `Du kannst natürlich mit mir schreiben. Diese Befehle funktionieren bereits:

Aufgabe: PC-Angebote vergleichen
Erstelle eine Aufgabe: Rechnung prüfen
Notiz: Idee für Shadow Grown
Speichere als Notiz: Werbevideo anbieten

Zeige Aufgaben
Zeige Notizen
Aufgabe erledigt: 1
Aufgabe wieder öffnen: 1
Aufgabe löschen: 1
Notiz löschen: 1

Rhia, Fokusmodus
Fokusmodus beenden
Chat löschen

Die Mikrofontaste nutzt die Spracheingabe deines Browsers, sofern sie dort unterstützt wird.`;
}

function profileAnswer(){
  return "Ich bin RHIA – RH Intelligent Assistant. Ich bin Mikes loyale digitale Partnerin und das langfristige Assistenzsystem von RH Produktion. Ich arbeite ehrlich, direkt, zuverlässig und lösungsorientiert. Wichtige Entscheidungen bleiben bei Mike.";
}

function handle(rawText){
  const originalText = String(rawText ?? "").trim();
  if(!originalText) return;

  addMessage(originalText,"user");

  const cleaned = stripWakeWord(originalText);
  const lower = cleaned.toLowerCase().replace(/\s+/g," ").trim();

  if(
    startsWithAny(lower,[
      "aufgabe:",
      "aufgabe hinzufügen:",
      "aufgabe hinzufuegen:",
      "erstelle eine aufgabe:",
      "erstell eine aufgabe:",
      "lege eine aufgabe an:",
      "neue aufgabe:"
    ])
  ){
    createEntry("tasks",afterColon(cleaned));
    return;
  }

  if(
    startsWithAny(lower,[
      "notiz:",
      "notiz erstellen:",
      "notiz hinzufügen:",
      "notiz hinzufuegen:",
      "erstelle eine notiz:",
      "speichere als notiz:",
      "neue notiz:"
    ])
  ){
    createEntry("notes",afterColon(cleaned));
    return;
  }

  if(equalsAny(lower,[
    "zeige aufgaben",
    "zeige meine aufgaben",
    "meine aufgaben",
    "welche aufgaben habe ich",
    "was sind meine aufgaben"
  ])){
    showList("tasks");
    return;
  }

  if(equalsAny(lower,[
    "zeige notizen",
    "zeige meine notizen",
    "meine notizen",
    "welche notizen habe ich"
  ])){
    showList("notes");
    return;
  }

  if(startsWithAny(lower,[
    "aufgabe erledigt:",
    "aufgabe abschließen:",
    "aufgabe abschliessen:"
  ])){
    toggleTaskByNumber(cleaned);
    return;
  }

  if(startsWithAny(lower,[
    "aufgabe wieder öffnen:",
    "aufgabe wieder oeffnen:"
  ])){
    toggleTaskByNumber(cleaned);
    return;
  }

  if(startsWithAny(lower,["aufgabe löschen:","aufgabe loeschen:"])){
    removeNumber("tasks",cleaned);
    return;
  }

  if(startsWithAny(lower,["notiz löschen:","notiz loeschen:"])){
    removeNumber("notes",cleaned);
    return;
  }

  if(equalsAny(lower,[
    "chat löschen",
    "chat loeschen",
    "chatverlauf löschen",
    "chatverlauf loeschen"
  ])){
    clearChat();
    return;
  }

  if(equalsAny(lower,["fokusmodus","fokusmodus starten","starte den fokusmodus"])){
    state.settings.focusMode = true;
    save();
    renderLists();
    addMessage("Fokusmodus ist aktiv, Sir. Wir bearbeiten jetzt genau einen nächsten Schritt. Was hat im Moment Vorrang?");
    return;
  }

  if(equalsAny(lower,[
    "fokusmodus beenden",
    "beende den fokusmodus",
    "fokusmodus aus"
  ])){
    state.settings.focusMode = false;
    save();
    renderLists();
    addMessage("Fokusmodus beendet. Wir können wieder normal weiterarbeiten.");
    return;
  }

  if(equalsAny(lower,["hilfe","was kannst du","was kannst du?","befehle"])){
    addMessage(helpAnswer());
    return;
  }

  if(includesAny(lower,[
    "wer bist du",
    "was bist du",
    "was ist rhia",
    "wofür steht rhia",
    "wofuer steht rhia"
  ])){
    addMessage(profileAnswer());
    return;
  }

  if(includesAny(lower,["wie sollst du sein","deine persönlichkeit","deine persoenlichkeit"])){
    addMessage("Ich arbeite loyal, ehrlich, locker, direkt, zuverlässig und lösungsorientiert. Ich nenne zuerst das klare Ergebnis, widerspreche respektvoll und spiele keine Sicherheit vor.");
    return;
  }

  if(includesAny(lower,["rh produktion","was ist rh produktion"])){
    addMessage("RH Produktion ist die Dachmarke. Darunter befinden sich Shadow Grown, RHIA und langfristig Kundenprojekte.");
    return;
  }

  if(includesAny(lower,["shadow grown","wer ist shadow grown"])){
    addMessage("Shadow Grown ist die Künstler- und Medienmarke von RH Produktion für Musik, Musikvideos, Social Media und Markenaufbau.");
    return;
  }

  if(includesAny(lower,["aktueller stand","welche version","dein status","projektstand"])){
    addMessage("RHIA Alpha v" + VERSION + " läuft. Chatverlauf, Aufgaben, Notizen, erste natürliche Chatbefehle, Fokusmodus-Grundlage und optionale Spracheingabe sind lokal verfügbar.");
    return;
  }

  if(includesAny(lower,[
    "hallo","hi rhia","hey rhia","guten morgen","guten tag","guten abend"
  ])){
    addMessage("Hallo Mike. RHIA Alpha v" + VERSION + " ist bereit. Was möchtest du erledigen?");
    return;
  }

  addMessage(
    "Ich habe verstanden, dass du frei mit mir sprechen möchtest. In dieser lokalen Alpha ist noch kein echtes KI-Modell verbunden. Aufgaben und Notizen kann ich aber bereits aus natürlicheren Befehlen erkennen. Schreibe „Hilfe“ für Beispiele."
  );
}

form.addEventListener("submit",event => {
  event.preventDefault();
  const value = command.value;
  command.value = "";
  handle(value);
  command.focus();
});

/* Optionale Browser-Spracheingabe */
const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

if(SpeechRecognition){
  const recognition = new SpeechRecognition();
  recognition.lang = "de-DE";
  recognition.interimResults = false;
  recognition.continuous = false;

  recognition.addEventListener("start",() => {
    voiceButton.classList.add("listening");
    voiceButton.textContent = "●";
    voiceButton.title = "RHIA hört zu";
  });

  recognition.addEventListener("end",() => {
    voiceButton.classList.remove("listening");
    voiceButton.textContent = "🎤";
    voiceButton.title = "Spracheingabe";
  });

  recognition.addEventListener("result",event => {
    const transcript = event.results?.[0]?.[0]?.transcript?.trim();
    if(transcript){
      command.value = transcript;
      handle(transcript);
      command.value = "";
    }
  });

  recognition.addEventListener("error",event => {
    console.warn("Spracheingabe:",event.error);
    addMessage("Die Spracheingabe konnte gerade nicht verwendet werden. Du kannst den Befehl weiterhin eintippen.");
  });

  voiceButton.addEventListener("click",() => {
    try{
      recognition.start();
    }catch(error){
      console.warn(error);
    }
  });
}else{
  voiceButton.disabled = true;
  voiceButton.title = "Spracheingabe wird von diesem Browser nicht unterstützt";
}

render();

if(state.chat.length === 0){
  addMessage(
    "RHIA Alpha v" + VERSION + " ist bereit, Mike.\n\n" +
    "Chatverlauf, Aufgaben und Notizen werden lokal gespeichert. " +
    "Du kannst mich jetzt zentral über den Chat bedienen. Schreibe „Hilfe“, um die ersten möglichen Befehle zu sehen.",
    "rhia",
    false
  );
}

command.focus();
</script>
</body>
</html>
