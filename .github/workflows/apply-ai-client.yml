name: Apply RHIA AI Client

on:
  push:
    branches:
      - rhia-alpha-v0.14-ai-foundation

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rhia-alpha-v0.14-ai-foundation

      - name: Patch frontend
        shell: python
        run: |
          from pathlib import Path
          path = Path("index.html")
          text = path.read_text(encoding="utf-8")

          marker = "function handle(raw){"
          ai_code = r'''
const AI_ENDPOINT="https://rhia-ai-gateway.brunsmike92.workers.dev/api/chat";

function aiHistory(){
  return state.chat.slice(-8).map(entry=>({
    role:entry.type==="rhia"?"assistant":"user",
    content:entry.text
  }));
}

function aiMemories(){
  return state.memories.slice(-20).map(memory=>({
    text:memory.content,
    category:memory.category||"Allgemein",
    world:memory.world||state.settings.world||"Allgemein"
  }));
}

async function askAI(message){
  const clean=String(message||"").trim();
  if(!clean){showReply("Was möchtest du wissen?",false);return}
  setVisualState("thinking");
  replyText.textContent="Ich denke nach …";
  try{
    const response=await fetch(AI_ENDPOINT,{
      method:"POST",
      headers:{"content-type":"application/json","x-rhia-client":"web-v0.14"},
      body:JSON.stringify({
        message:clean,
        world:state.settings.world||"Allgemein",
        memories:aiMemories(),
        history:aiHistory()
      })
    });
    const payload=await response.json().catch(()=>({}));
    if(!response.ok||!payload.ok){
      throw new Error(payload.error||"KI-Verbindung fehlgeschlagen");
    }
    showReply(payload.reply||"Ich habe gerade keine Antwort erhalten.");
  }catch(error){
    console.error("RHIA AI error",error);
    showReply("Meine KI-Verbindung ist noch nicht vollständig eingerichtet oder gerade nicht erreichbar. Deine lokalen Befehle funktionieren weiterhin.",false);
  }
}

'''
          if "const AI_ENDPOINT=" not in text:
              text = text.replace(marker, ai_code + marker, 1)

          old = '  showReply("Ich verstehe diesen freien Satz noch nicht sicher genug. Ich erfinde deshalb keine Antwort. Formuliere ihn als Aufgabe, Notiz, Idee oder Weltwechsel.",false);'
          new = '  askAI(cleaned);'
          if old not in text:
              raise SystemExit("Fallback marker not found")
          text = text.replace(old, new, 1)
          text = text.replace("<title>RHIA Alpha v0.10.0</title>","<title>RHIA Alpha v0.14.0</title>")
          text = text.replace("Alpha v0.10.0","Alpha v0.14.0")
          text = text.replace('const VERSION="0.10.0";','const VERSION="0.14.0";')
          path.write_text(text,encoding="utf-8")

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          rm -f .github/workflows/apply-ai-client.yml
          git config user.name "RHIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-ai-client.yml
          git commit -m "RHIA Alpha v0.14.0: connect frontend to AI gateway" || exit 0
          git push origin rhia-alpha-v0.14-ai-foundation
