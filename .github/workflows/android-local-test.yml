name: Build RHIA Android Local Test

on:
  push:
    branches: [main]
    paths:
      - "android-test/**"
      - ".github/workflows/android-local-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read app version
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Restore permanent signing key
        env:
          RHIA_KEYSTORE_BASE64: ${{ secrets.RHIA_KEYSTORE_BASE64 }}
          RHIA_KEYSTORE_PASSWORD: ${{ secrets.RHIA_KEYSTORE_PASSWORD }}
        run: |
          test -n "$RHIA_KEYSTORE_BASE64"
          test -n "$RHIA_KEYSTORE_PASSWORD"
          RHIA_KEYSTORE_PATH="$RUNNER_TEMP/rhia-release.jks"
          printf '%s' "$RHIA_KEYSTORE_BASE64" | base64 --decode > "$RHIA_KEYSTORE_PATH"
          test -s "$RHIA_KEYSTORE_PATH"
          chmod 600 "$RHIA_KEYSTORE_PATH"
          echo "RHIA_KEYSTORE_PATH=$RHIA_KEYSTORE_PATH" >> "$GITHUB_ENV"
          echo "RHIA_KEYSTORE_PASSWORD=$RHIA_KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
      - name: Validate signing key
        run: |
          keytool -list \
            -keystore "$RHIA_KEYSTORE_PATH" \
            -storepass "$RHIA_KEYSTORE_PASSWORD" \
            -alias rhia-release > /dev/null
      - name: Build signed release APK
        run: gradle :app:assembleRelease
      - name: Verify APK signature
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          test -x "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk ../RHIA-Android-Test.apk
      - name: Publish signed hybrid test release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${{ github.run_number }}"
          gh release create "$TAG" RHIA-Android-Test.apk \
            --repo "${{ github.repository }}" \
            --title "RHIA Android Hybrid Test v${APP_VERSION} (Build ${{ github.run_number }})" \
            --notes "Dauerhaft signierte RHIA-Testversion. Nach der einmaligen Neuinstallation können künftige Versionen als Update installiert werden, ohne lokale App-Daten zu löschen."
