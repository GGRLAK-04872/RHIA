name: Build RHIA Android Local Test

on:
  push:
    branches: [main]
    paths:
      - "android-test/**"
      - ".github/workflows/android-local-test.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Read app version
        run: |
          APP_VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts)
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: gradle :app:assembleDebug
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../RHIA-Android-Test.apk
      - name: Publish hybrid test release
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="android-test-${{ github.run_number }}"
          gh release create "$TAG" RHIA-Android-Test.apk \
            --repo "${{ github.repository }}" \
            --title "RHIA Android Hybrid Test v${APP_VERSION} (Build ${{ github.run_number }})" \
            --notes "Verhindert den doppelten Mikrofonstart und hält die lokale Erkennung nach einem Antippen stabil aktiv. Die Versionsnummer wird zentral aus der App-Konfiguration übernommen."
