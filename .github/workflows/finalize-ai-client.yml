name: Finalize RHIA AI Client

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Apply AI client patch
        run: python3 .github/scripts/apply_ai_client.py

      - name: Commit integration when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- index.html; then
            echo "RHIA AI client is already integrated."
            exit 0
          fi
          git add index.html
          git commit -m "RHIA Alpha v0.14.0: activate secure AI chat"
          git push origin main
