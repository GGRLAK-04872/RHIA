name: Apply RHIA Alpha v0.10 Memory

on:
  push:
    branches:
      - rhia-alpha-v0.10-memory

permissions:
  contents: write

jobs:
  apply-memory-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: rhia-alpha-v0.10-memory

      - name: Replace index with tested v0.10 memory build
        shell: bash
        run: |
          cat > /tmp/rhia_v010.gz.b64 <<'EOF'
          
          EOF
          base64 -d /tmp/rhia_v010.gz.b64 | gzip -d > index.html
          rm -f .github/workflows/apply-rhia-v010-memory.yml

      - name: Commit generated application
        shell: bash
        run: |
          git config user.name "RHIA Build Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html .github/workflows/apply-rhia-v010-memory.yml
          git commit -m "RHIA Alpha v0.10.0: controlled local memory" || exit 0
          git push origin rhia-alpha-v0.10-memory
